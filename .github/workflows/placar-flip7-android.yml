name: Placar Flip 7 (Android)

on:
  push:
    paths:
      - "placar-flip7-android/**"
      - ".github/workflows/placar-flip7-android.yml"
  pull_request:
    paths:
      - "placar-flip7-android/**"
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (vazio = número da execução; precisa crescer a cada envio)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: placar-flip7-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint e APK de teste
        run: ./gradlew --no-daemon lintDebug assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: placar-flip7-debug-apk
          path: placar-flip7-android/app/build/outputs/apk/debug/*.apk

      # O AAB assinado só é gerado se a chave de upload estiver nos secrets do repositório.
      - name: Preparar chave de upload
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "present=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: AAB de release assinado
        if: steps.key.outputs.present == 'true'
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/upload.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.event.inputs.version_code || github.run_number }}
        run: ./gradlew --no-daemon bundleRelease

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.present == 'true'
        with:
          name: placar-flip7-release-aab
          path: placar-flip7-android/app/build/outputs/bundle/release/*.aab
